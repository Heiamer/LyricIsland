# DotIsle V3: shared domain, media backend, one Vello application.
[workspace]
resolver = "2"
members = ["crates/dotisle-scene", "crates/lyric-core", "crates/lyric-backend", "crates/dotisle-domain", "crates/dotisle-app", "crates/dotisle-render", "crates/lyric-native", "crates/lyric-archive", "crates/lyric-bootstrap"]
# Vendored third-party crate: built as a path dependency, its own tests stay out of `cargo test --workspace`.
exclude = ["vendor/material-colors-0.4.2", "vendor/wgpu-hal-29.0.4", "vendor/vello_hybrid-0.2.0"]

[workspace.package]
version = "3.1.6"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["LyricIsland Rust port"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[patch.crates-io]
vello_hybrid = { path = "vendor/vello_hybrid-0.2.0" }
wgpu-hal = { path = "vendor/wgpu-hal-29.0.4" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

