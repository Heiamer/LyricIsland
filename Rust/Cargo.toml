# Current application workspace: lyric core, media backend, native island and GPUI settings.
[workspace]
resolver = "2"
members = ["crates/lyric-core", "crates/lyric-archive", "crates/lyric-bootstrap", "crates/lyric-tools", "crates/lyric-backend", "crates/lyric-settings", "crates/lyric-native"]
# Vendored third-party crate: built as a path dependency, its own tests stay out of `cargo test --workspace`.
exclude = ["vendor/material-colors-0.4.2"]

[workspace.package]
version = "2.1.6"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["LyricIsland Rust port"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = true
strip = true

# The local GPUI patch uses the owning display's compositor cadence and keeps
# animation changes reproducible without depending on an external fork.
[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
