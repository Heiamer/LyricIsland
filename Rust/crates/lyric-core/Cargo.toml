[package]
name = "lyric-core"
description = "Lyric parsing, matching and synchronization for Lyric Island"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
unicode-normalization = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
# Optional: strict-UTF-8-then-GBK decoding for local sidecar files, mirroring the
# original's `Encoding.GetEncoding(936)` fallback.
encoding_rs = { version = "0.8", optional = true }

[features]
default = ["gbk"]
gbk = ["dep:encoding_rs"]

[dev-dependencies]
