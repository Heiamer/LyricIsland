[package]
name = "lyric-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lyric_bootstrap"
path = "src/lib.rs"

[[bin]]
name = "lyric-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "lyric-updater"
path = "src/bin/updater.rs"

[[bin]]
name = "lyric-launcher"
path = "src/bin/launcher.rs"

[[bin]]
name = "lyric-uninstall"
path = "src/bin/uninstall.rs"

[dependencies]
dotisle-render = { path = "../dotisle-render" }
image = { version = "0.25", default-features = false, features = ["png"] }
vello = { package = "dotisle-scene", path = "../dotisle-scene" }
lyric-archive = { path = "../lyric-archive" }
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
flate2.workspace = true
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Com",
  "Win32_Networking_WinHttp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
] }
