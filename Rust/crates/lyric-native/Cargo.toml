[package]
name = "lyric-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "LyricIsland"
path = "src/main.rs"

[dependencies]
lyric-backend = { path = "../lyric-backend" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "ApplicationModel_Core", "Foundation", "Storage_Streams", "Win32_System_WinRT", "UI_ViewManagement", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Com",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm",
  "Win32_System_ProcessStatus"
] }




