[package]
name = "lyric-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "LyricIsland"
path = "src/main.rs"

[dependencies]
lyric-backend = { path = "../lyric-backend" }
# The shortcut parser, shared with the settings recorder.
lyric-core = { path = "../lyric-core" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
roxmltree = "=0.20.0"
image = { version = "0.25", default-features = false, features = ["png"] }
# Material Color Utilities port (Celebi quantizer, Score, HCT/TonalPalette) for cover-driven Monet palettes.
material-colors = { path = "../../vendor/material-colors-0.4.2" }
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Win32_Storage_Packaging_Appx", "ApplicationModel", "ApplicationModel_Core", "Foundation", "Storage_Streams", "Win32_System_WinRT", "UI_ViewManagement", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Com",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm",
  "Win32_System_ProcessStatus", "Win32_System_SystemInformation",
  "Win32_System_RemoteDesktop", "Win32_System_WindowsProgramming",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry"
] }




