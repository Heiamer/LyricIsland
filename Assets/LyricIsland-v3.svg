<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<title>DotIsle · 石墨与微光</title><desc>暖瓷白圆角底板，中央仅保留一个石墨黑灵动岛胶囊，胶囊内部靠右一颗暖黄状态点，无外置卫星点、音符或文字。</desc>
<defs>
<linearGradient id="porcelain" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FAF9F6"/><stop offset="1" stop-color="#E6E7E3"/></linearGradient>
<linearGradient id="graphite" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#363C3D"/><stop offset=".55" stop-color="#202627"/><stop offset="1" stop-color="#151B1C"/></linearGradient>
<linearGradient id="edge" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".30"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/></linearGradient>
<filter id="shadow" x="-20%" y="-50%" width="140%" height="220%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18201F" flood-opacity=".14"/></filter>
</defs>
<rect x="48" y="48" width="928" height="928" rx="218" fill="url(#porcelain)"/>
<rect x="50" y="50" width="924" height="924" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3"/>
<rect x="164" y="380" width="696" height="264" rx="132" fill="url(#graphite)" filter="url(#shadow)"/>
<rect x="166" y="382" width="692" height="260" rx="130" fill="none" stroke="url(#edge)" stroke-width="3"/>
<circle cx="756" cy="512" r="22" fill="#F4C34D"/></svg>